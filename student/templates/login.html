{% comment %} <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="static/css/login.css"> {% endcomment %}

    {% block title %}
    <link rel="stylesheet" href="static/css/login.css">
    {% endblock title %}

{% comment %} </head>
<body> {% endcomment %}

    {% block body %}

  
    
    
 <div class="hero">
    <div class="form-box">
    <div class="button-box">
    <div id="btn"></div>
    <button  type="button" class="toggle-btn" onclick="login()"><a href="/log">Log In </a></button>
    <button  type="button" class="toggle-btn" onclick="Register()"  ><a href="/">Register </a></button>
      </div>
      <div class="social-icons">
 <img src="static/image/fb.png" >
 <img src="static/image/tw.png" >
 <img src="static/image/gb.png">
 </div>

 <form action="/log" method ="POST" id="login" class="input-group">
    {% csrf_token %}
 <input type="text" class="input-field" placeholder="User Name" name="name" required>
 <input type="text" class="input-field" placeholder="Enter Password" name="passa" required>
 <input type="checkbox" class="check-box"><span> Remember Password</span>
 <button class="submit-btn">Login</button>
 
 </form>


 <form action="" method="post" id="Register" class="input-group">
    {% csrf_token %}
<input type="text" name ="username" class="input-field" placeholder="User name"  required>
 <input type="text" name ="name" class="input-field" placeholder="Name"  required>
 <input type="text"  name ="lname" class="input-field" placeholder="Last Name"  required>
 <input type="email" name ="email" class="input-field" placeholder="Email Id"  required>
 <input type="text" name ="passa"  class="input-field" placeholder="Enter Password"  required>
 <input type="checkbox" class="check-box"><span> I agree to the terms conditions</span>
 <button type="submit" class="submit-btn">Register</button>

 </form>

    </div>
</div>

<script src="static/js/login.js"></script>

<script>
 {% for message in messages %}
alert("{{message}}")
 {% endfor %}
</script> 

    {% endblock body %}
